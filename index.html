<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Payment Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md text-center">
    <h2 id="name" class="text-xl font-semibold text-gray-800 mb-4"></h2>
    <div id="qrcode" class="flex justify-center mb-4"></div>
    <a id="payLink" target="_blank" class="block">
      <button class="w-full bg-green-500 hover:bg-green-600 text-white p-3 rounded-lg mb-3 transition">
        Pay Now
      </button>
    </a>
    <a href="linkpe.html?new" class="text-sm text-blue-500 hover:underline">
      Create your own payment link
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pn = params.get('pn') || '';
    const pa = params.get('pa');

    if (!pa) {
      window.location.replace("linkpe.html?error");
    } else {
      const name = pn || pa;
      const upiUrl = 'upi://pay?' + params.toString();

      document.getElementById("name").innerHTML = 
        `Scan QR or Click below to Pay <br><span class="font-bold">${name}</span>`;
      document.getElementById("payLink").href = upiUrl;

      QRCode.toCanvas(document.createElement('canvas'), upiUrl, { width: 200 }, (err, canvas) => {
        if (!err) document.getElementById("qrcode").appendChild(canvas);
      });
    }
  </script>
</body>
</html>
