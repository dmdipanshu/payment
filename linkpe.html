<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPI Link Generator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen text-white p-4">
  <div class="bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-4">UPI Payment Link Generator</h2>
    <form id="upiForm" class="space-y-3">
      <input type="text" name="pn" placeholder="Your Name (Optional)" class="w-full p-2 rounded bg-gray-700 focus:outline-none">
      <input type="text" name="pa" placeholder="UPI ID" required class="w-full p-2 rounded bg-gray-700 focus:outline-none">
      <input type="number" name="am" placeholder="Amount (Optional)" class="w-full p-2 rounded bg-gray-700 focus:outline-none">
      <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 p-2 rounded transition">Generate Link</button>
    </form>

    <div id="result" class="mt-5 hidden text-center">
      <textarea id="upiLink" class="w-full p-2 rounded bg-gray-700 text-sm" rows="3" readonly></textarea>
      <div id="qrcode" class="flex justify-center my-3"></div>
      <div class="flex space-x-2 mt-2">
        <button onclick="copyLink()" class="flex-1 bg-green-500 hover:bg-green-600 p-2 rounded transition">Copy</button>
        <a id="whatsappShare" class="flex-1 bg-green-700 hover:bg-green-800 p-2 rounded text-center transition" target="_blank">WhatsApp</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('upiForm');
    const resultDiv = document.getElementById('result');
    const upiLinkField = document.getElementById('upiLink');
    const whatsappShare = document.getElementById('whatsappShare');
    const qrcodeDiv = document.getElementById('qrcode');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const pn = form.pn.value.trim();
      const pa = form.pa.value.trim();
      const am = form.am.value.trim();

      let link = `upi://pay?pa=${encodeURIComponent(pa)}&pn=${encodeURIComponent(pn)}&cu=INR`;
      if (am) link += `&am=${encodeURIComponent(am)}`;

      upiLinkField.value = link;
      whatsappShare.href = `https://wa.me/?text=${encodeURIComponent('Pay via UPI: ' + link)}`;
      resultDiv.classList.remove('hidden');

      qrcodeDiv.innerHTML = "";
      QRCode.toCanvas(document.createElement('canvas'), link, { width: 180 }, function (err, canvas) {
        if (!err) qrcodeDiv.appendChild(canvas);
      });
    });

    function copyLink() {
      upiLinkField.select();
      document.execCommand('copy');
      alert('Link copied to clipboard!');
    }
  </script>
</body>
</html>
