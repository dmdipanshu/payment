<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkPe | UPI LINK Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>
  <body class="bg-gray-900 text-white flex justify-center items-center min-h-screen">
    <div class="bg-gray-800 p-6 rounded-2xl shadow-lg w-full max-w-md text-center">
      <img src="img/logo.png" alt="Logo" class="mx-auto mb-4 h-12">
      <h2 class="text-xl font-semibold mb-2">Create UPI Payment Request Link</h2>
      <img src="img/upi.png" alt="UPI" class="mx-auto mb-4 h-20">

      <!-- Generated Link Section -->
      <div id="linkpediv" class="hidden">
        <textarea id="linkpeURL" class="w-full p-2 rounded-lg text-black" rows="3" readonly></textarea>
        <div class="flex gap-2 mt-3">
          <button id="btn-copy" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">Copy Link</button>
          <a id="whatsapp" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-center">Share</a>
        </div>
      </div>

      <!-- Input Form -->
      <form id="linkpeform" class="mt-4 space-y-3">
        <input type="text" name="pn" placeholder="Enter your name (Optional)" class="w-full p-2 rounded-lg text-black">
        <input type="email" name="pa" placeholder="Enter UPI Id" required class="w-full p-2 rounded-lg text-black">
        <input type="number" name="am" placeholder="Enter Amount (Optional)" class="w-full p-2 rounded-lg text-black">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">Submit</button>
      </form>

      <p class="text-gray-400 text-sm mt-4">
        Developed by <a href="https://ptprashanttripathi.github.io" class="text-blue-400">Pt. Prashant Tripathi</a>
      </p>
    </div>

    <script>
      const form = document.getElementById("linkpeform");
      const linkDiv = document.getElementById("linkpediv");
      const linkField = document.getElementById("linkpeURL");
      const copyBtn = document.getElementById("btn-copy");
      const whatsappBtn = document.getElementById("whatsapp");

      const params = new URLSearchParams(window.location.search);
      const pn = params.get("pn");
      const pa = params.get("pa");
      const am = params.get("am");

      function generateLink(pa, pn, am) {
        let baseUrl = window.location.hostname.includes("localhost")
          ? `${window.location.protocol}//${window.location.hostname}:${window.location.port}/index.html`
          : `${window.location.protocol}//${window.location.hostname}/linkpe`;

        let url = `${baseUrl}?pa=${pa}&pn=${pn}&cu=INR`;
        if (am && !isNaN(am)) url += `&am=${am}`;
        return url;
      }

      if (pa) {
        const link = generateLink(pa, pn, am);
        linkField.value = link;
        whatsappBtn.href = `https://wa.me/?text=${encodeURIComponent("Hi, You can pay me using this UPI Payment Link:\n" + link)}`;
        linkDiv.classList.remove("hidden");
        form.classList.add("hidden");
      }

      form.addEventListener("submit", e => {
        e.preventDefault();
        const formData = new FormData(form);
        const link = generateLink(formData.get("pa"), formData.get("pn"), formData.get("am"));
        linkField.value = link;
        whatsappBtn.href = `https://wa.me/?text=${encodeURIComponent("Hi, You can pay me using this UPI Payment Link:\n" + link)}`;
        linkDiv.classList.remove("hidden");
        form.classList.add("hidden");
      });

      copyBtn.addEventListener("click", async () => {
        await navigator.clipboard.writeText(linkField.value);
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy Link"), 2000);
      });
    </script>
  </body>
</html>
