<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay via UPI</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .payment-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 380px;
      padding: 20px;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .header {
      font-size: 18px;
      color: #333;
      margin-bottom: 5px;
    }
    .sub-text {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .amount {
      font-size: 26px;
      font-weight: bold;
      color: #28a745;
      margin-bottom: 15px;
    }
    #qr {
      margin: 15px auto;
      display: block;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }
    .btn {
      display: block;
      width: 100%;
      background: #007bff;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 15px;
      text-decoration: none;
      transition: 0.2s;
    }
    .btn:hover {
      background: #0056b3;
    }
    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #999;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>

<div class="payment-card">
  <div class="header" id="payTitle">Loading...</div>
  <div class="sub-text" id="payDesc">Please wait...</div>
  <div class="amount" id="payAmount">--</div>
  <canvas id="qr"></canvas>
  <a id="payNow" class="btn" target="_blank">Pay Now</a>
  <div class="footer">Secured by UPI · Instant Payment</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
  // Get query parameters
  const urlParams = new URLSearchParams(window.location.search);
  const pa = urlParams.get("pa");
  const pn = urlParams.get("pn");
  const am = urlParams.get("am");

  // Validate and generate payment details
  if (!pa) {
    document.getElementById("payTitle").innerText = "Invalid Payment Link";
    document.getElementById("payDesc").innerText = "UPI ID is missing";
  } else {
    let upiUrl = `upi://pay?pa=${pa}`;
    if (pn) upiUrl += `&pn=${encodeURIComponent(pn)}`;
    if (am) upiUrl += `&am=${am}`;
    upiUrl += `&cu=INR`;

    document.getElementById("payTitle").innerText = pn ? `Pay ${pn}` : `Pay via UPI`;
    document.getElementById("payDesc").innerText = pa;
    document.getElementById("payAmount").innerText = am ? `₹${am}` : "Amount not fixed";
    document.getElementById("payNow").href = upiUrl;

    // Generate QR Code
    new QRious({
      element: document.getElementById("qr"),
      value: upiUrl,
      size: 200,
      background: "white",
      foreground: "black",
      level: "H"
    });
  }
</script>

</body>
</html>
